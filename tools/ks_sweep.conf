# tools/ks_sweep.conf -- the ONE place the kappa_shear sweep's axes live.
#
# Sourced by tools/ks_sweep.sh. Every value can also be overridden from the
# environment (`NZ_LIST="30 75" ./tools/ks_sweep.sh nz`) so this file holds the
# defaults that produce the blog/paper figures and you never have to edit it to
# do a quick probe.
#
# KEEP THIS FILE MACHINE-INDEPENDENT. Which compilers, devices and modes exist
# is DETECTED at run time -- that is what lets the same sweep run unmodified on
# a V100 box, a GH200, an MI250X node or a 104-core Sapphire Rapids.

# ---------------------------------------------------------------------------
# Depth axis. nz is the interesting one for this kernel: the column solve is
# sequential in k, so nz is the serial-chain length, while nx*ny is the
# parallel width. NZ_LIST spans MOM6-realistic depths (30 = this repo's
# configs, 50/75 = OM4-class z*, 100 = a deep z* config). All six sit at or
# below NZ_STACK_MAX = 128, so BOTH stack policies (`prod` = 128 and `fit` =
# nz+1) are expressible at every point -- which is what makes the frame-size
# effect separable from the real work across the whole curve.
# ---------------------------------------------------------------------------
NZ_LIST=${NZ_LIST:-"10 25 30 50 75 100"}

# Reference depths for the experiments that hold nz fixed.
NZ_REF=${NZ_REF:-30}
NZ_DEEP=${NZ_DEEP:-128}

# ---------------------------------------------------------------------------
# Per-column stack policy -- MANDATORY as an axis, not a constant.
# NZ_STACK_MAX is compile-time and INDEPENDENT of nz: every private column
# array is sized to it regardless of the runtime depth (constants.F90 calls it
# "the whole ballgame"). So a naive nz sweep at fixed NZSTACK=128 conflates
# "more layers of real work" with "a fixed 129-double frame being amortised
# over more work".
#   prod : NZSTACK=128    what production compiles (skipped when nz+1 > 128)
#   fit  : NZSTACK=nz+1   frame sized to the actual column
# ---------------------------------------------------------------------------
STACK_POLICIES=${STACK_POLICIES:-"prod fit"}

# ---------------------------------------------------------------------------
# Copy policy -- the 1:1 / same-algorithmic-complexity pairing.
# ks_solve_column's three whole-array assignments copy the DECLARED extent in
# Fortran (O(NZSTACK)) and were bounded to 1..nz+1 in the CUDA port (O(nz)).
# Comparing across that difference times the copy, not the codegen, so the two
# sides are always built as a MATCHED pair:
#   prod : DC BCOPY=0  <->  CUDA FULLCOPY=1     both O(NZSTACK)  [true 1:1]
#   opt  : DC BCOPY=1  <->  CUDA FULLCOPY=0     both O(nz)
# ---------------------------------------------------------------------------
COPY_POLICIES=${COPY_POLICIES:-"prod opt"}

# ---------------------------------------------------------------------------
# Parallel-width axis, as "NXPxNYP" interior sizes (ghosts are added by the
# driver, so the real column count is (NXP+6)*(NYP+6) -- the harness records
# both). 473x297 is the production 0.1-deg grid; the small end is deliberately
# MOM6-per-rank scale (an OM4_025 rank owns of order 1e3 columns, not 1e5),
# because that is the number the MPI extrapolation needs.
# ---------------------------------------------------------------------------
COLS_LIST=${COLS_LIST:-"16x16 32x32 64x64 128x128 256x256 473x297"}

# Reference sizes for the experiments that hold the width fixed. GPU modes need
# the production width to be occupancy-honest; serial CPU modes would take
# hours there, so they get their own reference size and the harness normalises
# to ns/column (and the `cols` experiment exists to check that normalisation is
# actually flat).
COLS_GPU=${COLS_GPU:-"473x297"}
COLS_CPU=${COLS_CPU:-"128x128"}

# Hard cap on columns for SERIAL modes (serial_do, dc_serial). Above this they
# are skipped with a printed reason rather than silently eating the budget.
SERIAL_MAX_COLS=${SERIAL_MAX_COLS:-40000}

# ---------------------------------------------------------------------------
# Arrangement axis (VARIANT=block). VLEN is the portability knob: 1 must be
# bit-identical to the faithful per-column kernel, 8/16 are AVX2/AVX-512
# widths, 32/64 a warp/wavefront. Skipped automatically if ks_block.F90 is
# absent.
# ---------------------------------------------------------------------------
VLEN_LIST=${VLEN_LIST:-"1 2 4 8 16 32"}

# ---------------------------------------------------------------------------
# Thread axis for dc_multicore. "auto" = powers of two up to the core count,
# plus the core count itself. OMP_PLACES=cores is always set; BIND_LIST picks
# OMP_PROC_BIND (on a 104-core Sapphire Rapids or a dual-socket EPYC, close vs
# spread is not a detail).
# ---------------------------------------------------------------------------
THREAD_LIST=${THREAD_LIST:-auto}
BIND_LIST=${BIND_LIST:-"close"}

# ---------------------------------------------------------------------------
# CUDA-side optimisation knobs (the `cuopt` experiment). OPT_NZMAX_MODE=fit
# tracks nz+1; a list of MINBLOCKS values sweeps the register/occupancy trade
# that OPTIMIZATION.md found to be monotonically bad on a V100 -- worth
# re-testing per architecture rather than assuming.
# ---------------------------------------------------------------------------
MINBLOCKS_LIST=${MINBLOCKS_LIST:-"0 6 8"}

# ---------------------------------------------------------------------------
# Land fraction. 0 = every column wet. A non-zero value makes the mask
# spatially coherent (a NW block), which changes warp divergence -- interesting
# on GPUs, nearly irrelevant on CPUs.
# ---------------------------------------------------------------------------
LAND_PCT=${LAND_PCT:-0}

# ---------------------------------------------------------------------------
# Measurement discipline.
#   KS_TARGET_MS  each timed loop auto-sizes its rep count to about this long,
#                 so a sweep spanning 2 orders of magnitude in cost/rep neither
#                 measures clock noise at the shallow end nor burns an hour at
#                 the deep end.
#   KS_MAX_REPS   ceiling on that auto rep count. Rep-to-rep spread on this
#                 kernel is small, so 50-100 reps already pins the mean; without
#                 a cap the cheap end of the sweep computes ~900 reps and spends
#                 the whole budget on decimal places.
#   NRUN          independent process invocations per configuration; the harness
#                 records min and median. Under any GPU contention min is the
#                 only statistic with a defensible meaning.
#   KS_WARM       warm-up reps inside each invocation. NOTE the name: plain
#                 `WARM` is already taken by benchmark_config.mk (via
#                 benchmark_common.sh), and reusing it would silently inherit
#                 that file's value instead of this one.
#   RUN_TIMEOUT   per-invocation wall limit (s). A timeout is RECORDED, not
#                 hidden: the CSV row says TIMEOUT.
#   COUNTERS_PASS 1 -> also run a -DKS_COUNTERS build at reps=1 per config to
#                 record iterations/column. This is the WORK metric; without it
#                 an nz curve cannot distinguish more layers from more
#                 iterations. Never timed (it adds registers to a
#                 register-bound kernel), so it costs one extra build + one rep.
# ---------------------------------------------------------------------------
KS_TARGET_MS=${KS_TARGET_MS:-1000}
KS_MAX_REPS=${KS_MAX_REPS:-100}
NRUN=${NRUN:-3}
KS_WARM=${KS_WARM:-2}
RUN_TIMEOUT=${RUN_TIMEOUT:-900}
COUNTERS_PASS=${COUNTERS_PASS:-1}

# Compilers / modes to consider. "auto" detects what is on PATH and what
# devices exist. Override to pin a lane, e.g. COMPILERS="ifx".
COMPILERS=${COMPILERS:-auto}
# MODES=auto detects everything runnable. MODES=dc is a shorthand for every
# `do concurrent` lane and nothing else -- the right setting on an AMD or Intel
# box, where the hand-written CUDA comparison is not the question.
MODES=${MODES:-auto}

# Experiments run when none are named on the command line. Baseline first:
# `nz` and `copy` are the two that must exist before any optimisation claim.
EXPERIMENTS=${EXPERIMENTS:-"nz copy cols threads"}
