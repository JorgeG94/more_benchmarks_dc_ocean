# tools/ks_min.conf -- everything tools/ks_min.sh needs, stated EXPLICITLY.
#
# WHY THIS EXISTS: tools/ks_sweep.sh probes for everything (compilers, devices,
# arch, GPU idleness). That is right for a machine you have never seen, but on
# Grace-Hopper `nvidia-smi` can take seconds per call, and the full harness calls
# it once per emitted CSV row for the device name PLUS a polling idle-gate before
# EVERY run. On a dedicated node that is pure overhead measuring nothing.
#
# So: this file replaces every probe with a stated fact. ks_min.sh runs
# nvidia-smi ZERO times, holds no lock, and detects nothing.
#
# Everything here is overridable from the environment:
#   FC=ifx MODE=dc_gpu DATA=omp ./tools/ks_min.sh
# and results land in the SAME CSV schema as ks_sweep.sh, so tools/ks_report.py
# reads both and they aggregate across machines.

# ---- toolchain + target (STATED, not detected) -----------------------------
FC=${FC:-nvfortran}
ARCH=${ARCH:-cc90}          # nvfortran -gpu=<arch>: V100 cc70, A100 cc80, H100/GH200 cc90
NVARCH=${NVARCH:-sm_90}     # nvcc -arch, only used when CUDA=on
DEVICE=${DEVICE:-GH200}     # free-text label for the CSV `device` column
# Recorded in the CSV's gpu_arch column. Defaults to $ARCH, which is an NVIDIA
# spelling -- so on AMD it would label an MI250X run `cc90`. If DC_GPU_FLAGS
# carries an --offload-arch, believe that instead.
GPU_ARCH_LABEL=${GPU_ARCH_LABEL:-$(printf '%s' "${DC_GPU_FLAGS:-}" | grep -oE 'offload-arch=[A-Za-z0-9_]+' | head -1 | cut -d= -f2)}
GPU_ARCH_LABEL=${GPU_ARCH_LABEL:-$ARCH}

# ---- what to run ------------------------------------------------------------
# MODE: serial_do | dc_serial | dc_multicore | dc_gpu
#   dc_gpu uses DATA below. DATA=acc is nvfortran/OpenACC; DATA=omp is the
#   OpenMP-target layer -- the SAME source, and the path AMD and Intel take.
MODE=${MODE:-dc_gpu}
DATA=${DATA:-acc}

# CUDA=on additionally builds `make cmp` and times do concurrent, cuda_faithful
# and cuda_opt from ONE binary on the SAME device allocation. Requires
# nvfortran + nvcc + an NVIDIA device; leave off on AMD/Intel.
CUDA=${CUDA:-off}

# Vendor GPU offload flags, used ONLY when MODE=dc_gpu and this is non-empty.
# It replaces the kernel Makefile's DC_MODE_FLAGS wholesale, so paste the full
# set. Leave empty for nvfortran (the Makefile's DATA=acc|omp path is correct).
#   ifx      : -qopenmp -fopenmp-targets=spir64 -fopenmp-target-do-concurrent -DDC_DATA_OMP
#   flang/amd: -fopenmp --offload-arch=gfx942 -fdo-concurrent-to-openmp=device -DDC_DATA_OMP
DC_GPU_FLAGS=${DC_GPU_FLAGS:-}

# ---- problem -----------------------------------------------------------------
NZ_LIST=${NZ_LIST:-"10 25 30 50 75 100"}
NXP=${NXP:-473}
NYP=${NYP:-297}
LAND_PCT=${LAND_PCT:-0}

# Per-column stack policy, the axis that must not be collapsed:
#   prod = NZSTACK 128 (what production compiles), fit = NZSTACK nz+1.
# NZ_STACK_MAX is compile-time and independent of nz, so a single-policy sweep
# cannot separate "more layers of work" from "a fixed frame being amortised".
# `prod` = 128, `fit` = nz+1, or a BARE NUMBER for an explicit NZ_STACK_MAX.
# The numbers are what let you sweep the frame at fixed depth and find where the
# penalty sets in:  NZ_LIST=30 STACK_POLICIES="31 40 48 64 96 128"
STACK_POLICIES=${STACK_POLICIES:-"prod fit"}

# 1 -> -DKS_BOUNDED_COPY. ks_solve_column's three whole-array assignments copy
# the DECLARED extent, i.e. O(NZ_STACK_MAX) per substep REGARDLESS of nz -- 129
# doubles even at nz=10. Prime suspect for the AMD large-frame penalty, and a
# one-flag test: if BCOPY=1 collapses the prod/fit gap, the mechanism is that
# copy rather than the frame itself.
BCOPY=${BCOPY:-0}

# Threads for MODE=dc_multicore. BOTH env vars are set per run: nvfortran's
# -stdpar=multicore reads ACC_NUM_CORES and IGNORES OMP_NUM_THREADS, while ifx
# and flang are the reverse. Setting one gives a scaling curve flat at 1.00x.
THREAD_LIST=${THREAD_LIST:-"1 8 32 72"}

# ---- measurement -------------------------------------------------------------
KS_TARGET_MS=${KS_TARGET_MS:-1000}   # each timed loop auto-sizes to about this
KS_MAX_REPS=${KS_MAX_REPS:-100}      # ceiling on the auto rep count
KS_WARM=${KS_WARM:-2}
NRUN=${NRUN:-3}                      # invocations per config; min and median kept
COUNTERS=${COUNTERS:-1}              # extra reps=1 pass for the iteration counts

# Physics profile, passed to the binary as KS_PHYS.
#   faithful = MOM6's CODE defaults, which is what the kernel source carries.
#              Every run recorded before 2026-08-04 is this, and it is the
#              setting the bit-identity fingerprints (kd_sum) were taken at.
#   prod     = the values a real OM4_025/OM5_025 configuration sets: DT_THERM
#              7200 (not 300), KD 1.5e-5 (not 1e-7), kappa_trunc 1.5e-7,
#              MAX_RINO_IT 25, Wright EOS.
# This is NOT a tuning knob, it changes the problem. Measured on a V100:
# absolute cost 4.6-7.3x higher, and dc/cuda moves +5-6% (against DC). At
# `faithful` every column takes exactly ONE adaptive substep, so that whole
# level of the loop nest goes unexercised.
PHYS=${PHYS:-faithful}
KS_PHYS=${KS_PHYS:-$PHYS}
